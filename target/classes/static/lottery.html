<!DOCTYPE html>
<html>
<head>
    <title>大转盘抽奖</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; text-align: center; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: 40px auto; }
        h1 { color: #d32f2f; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .wheel-container { position: relative; width: 500px; height: 500px; margin: 0 auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .segment { position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; }
        .segment span { position: absolute; left: 50%; top: 10px; transform: rotate(45deg) translateX(-50%); color: white; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .center { position: absolute; width: 60px; height: 60px; background: #d32f2f; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #d32f2f; z-index: 20; }
        button { background: #d32f2f; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 4px; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        button:hover { background: #b71c1c; }
        .result { margin-top: 20px; padding: 15px; background: white; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>幸运大转盘</h1>
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- 8 segments -->
                <div class="segment" style="background: #FF6B6B; transform: rotate(0deg) skew(30deg);"><span>一等奖</span></div>
                <div class="segment" style="background: #4ECDC4; transform: rotate(45deg) skew(30deg);"><span>二等奖</span></div>
                <div class="segment" style="background: #45B7D1; transform: rotate(90deg) skew(30deg);"><span>三等奖</span></div>
                <div class="segment" style="background: #FFD166; transform: rotate(135deg) skew(30deg);"><span>四等奖</span></div>
                <div class="segment" style="background: #6A4C93; transform: rotate(180deg) skew(30deg);"><span>五等奖</span></div>
                <div class="segment" style="background: #FF9F1C; transform: rotate(225deg) skew(30deg);"><span>六等奖</span></div>
                <div class="segment" style="background: #118AB2; transform: rotate(270deg) skew(30deg);"><span>七等奖</span></div>
                <div class="segment" style="background: #06D6A0; transform: rotate(315deg) skew(30deg);"><span>八等奖</span></div>
            </div>
            <div class="center"></div>
        </div>
        <button id="spin-btn">开始抽奖</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const prizes = ['一等奖', '二等奖', '三等奖', '四等奖', '五等奖', '六等奖', '七等奖', '八等奖'];
        const spinBtn = document.getElementById('spin-btn');
        const wheel = document.getElementById('wheel');
        const resultDiv = document.getElementById('result');
        let canSpin = true;

        spinBtn.addEventListener('click', () => {
            if (!canSpin) return;

            canSpin = false;
            const spinAngle = 3600 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${spinAngle}deg)`;

            setTimeout(() => {
                const actualAngle = spinAngle % 360;
                const segmentIndex = Math.floor((360 - actualAngle) / 45) % 8;
                const prize = prizes[segmentIndex];

                resultDiv.innerHTML = `<h2>恭喜获得：${prize}！</h2>`;

                // Send result to backend
                fetch('/api/lottery/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prize: prize })
                })
                .then(response => response.json())
                .then(data => {
                    resultDiv.innerHTML += `<p>记录ID: ${data.id}</p>`;
                    setTimeout(() => { canSpin = true; }, 1000);
                })
                .catch(error => {
                    console.error('保存失败:', error);
                    resultDiv.innerHTML += '<p style="color: red;">保存结果失败</p>';
                    setTimeout(() => { canSpin = true; }, 1000);
                });
            }, 4000);
        });
    </script>
</body>
</html>
