spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lottery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# 管理后台账号（生产环境请通过环境变量覆盖或改用 BCrypt 加密）
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:{noop}admin123}
spring.security.user.roles=ADMIN